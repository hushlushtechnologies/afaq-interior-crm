<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Afaq CRM password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f1ea;
      color: #302820;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 24px auto;
        padding: 28px;
        border: 1px solid #ddd3c7;
        border-radius: 24px;
        background: #fffcf7;
      "
    >
      <p style="margin: 0 0 20px; font-size: 14px; font-weight: bold">
        Afaq Al Manzel Interiors
      </p>

      <h1 style="margin: 0 0 16px; font-size: 24px">
        Reset your password
      </h1>

      <p style="color: #6b5e52; font-size: 15px; line-height: 1.7">
        Continue to the CRM to verify this request and choose a new password.
      </p>

      <p style="margin: 28px 0">
        <a
          href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery"
          style="
            display: inline-block;
            padding: 14px 20px;
            border-radius: 14px;
            background: #302820;
            color: #fffcf7;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
          "
        >
          Continue password reset
        </a>
      </p>

      <p style="color: #6b5e52; font-size: 14px; line-height: 1.7">
        This link expires and can only be used once. If you did not request
        a password reset, you can ignore this email.
      </p>
    </div>
  </body>
</html>
