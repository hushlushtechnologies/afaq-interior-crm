<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Afaq CRM local invitation</title>
  </head>
  <body style="font-family:Arial,sans-serif;padding:24px;background:#f5f1ea;color:#302820">
    <h1>You are invited to Afaq CRM</h1>
    <p>
      This is a local test invitation. Continue to verify the one-time link and choose your password.
    </p>
    <p>
      <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=invite">
        Accept employee invitation
      </a>
    </p>
    <p>
      The link expires and can be verified only once. Roles are assigned separately by an administrator.
    </p>
  </body>
</html>
