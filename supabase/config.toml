project_id = "afaq-interiors-crm-s09-local"

[api]
enabled = true
port = 57421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 57422
shadow_port = 57420
major_version = 17

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 57423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 57424

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/accept-invitation",
  "http://127.0.0.1:3100/auth/accept-invitation",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/update-password",
  "http://127.0.0.1:3100/auth/confirm",
  "http://127.0.0.1:3103/auth/confirm"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Verify your Afaq CRM email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Your Afaq CRM local invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Afaq CRM password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[edge_runtime]
enabled = false

[analytics]
enabled = false